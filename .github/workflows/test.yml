name: Offline tests

on:
  push:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - LICENSE
      - SECURITY.md
      - .readthedocs.yaml
      - .env.example
      - dev/*.md
      - docs/**
      - examples/**
      - .agents/**
      - .claude/**
      - .codex/**
      - .entire/**
      - .gemini/**
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - LICENSE
      - SECURITY.md
      - .readthedocs.yaml
      - .env.example
      - dev/*.md
      - docs/**
      - examples/**
      - .agents/**
      - .claude/**
      - .codex/**
      - .entire/**
      - .gemini/**
      - .github/ISSUE_TEMPLATE/**

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14', '3.15']
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      POETRY_NO_INTERACTION: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: false
      - name: Prepare isolated temporary root
        env:
          OBFORCE_TEST_TEMP: ${{ runner.temp }}/obforce-runtime-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -c "
          import os
          from pathlib import Path
          root = Path(os.environ['OBFORCE_TEST_TEMP'])
          root.mkdir()
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write(''.join(name + '=' + str(root) + '\n' for name in ('TMPDIR', 'TEMP', 'TMP')))
          "
      - name: Install Poetry
        run: python -m pip install poetry==2.4.2
      - name: Select Python environment
        run: poetry env use python
      - name: Install locked environment
        run: poetry install --with dev
      - name: Check metadata and lock
        run: poetry check --lock --strict
      - name: Lint sources
        run: poetry run ruff check .
      - name: Check formatting
        run: poetry run ruff format --check .
      - name: Audit source security
        run: poetry run bandit -r src/obforce
      - name: Preflight bounded test collection
        timeout-minutes: 6
        run: poetry run python dev/run_pytest.py --collect-only --log "${{ runner.temp }}/obforce-collect-${{ github.run_id }}-${{ github.run_attempt }}.log"
      - name: Run offline tests
        timeout-minutes: 50
        run: poetry run python dev/run_pytest.py --log "${{ runner.temp }}/obforce-pytest-${{ github.run_id }}-${{ github.run_attempt }}.log"
      - name: Build fresh artifacts
        run: poetry build --output "${{ runner.temp }}/obforce-candidate-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Check artifact metadata
        run: poetry run twine check --strict "${{ runner.temp }}/obforce-candidate-${{ github.run_id }}-${{ github.run_attempt }}/*"
      - name: Inspect and install each artifact independently
        timeout-minutes: 30
        run: poetry run python dev/check_artifacts.py "${{ runner.temp }}/obforce-candidate-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Check whitespace
        run: git diff --check
